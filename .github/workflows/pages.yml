name: Deploy preview to GitHub Pages

# Menerbitkan situs ke https://<pemilik>.github.io/arcana/ pada setiap push ke main.
# GitHub Pages di GitHub Free hanya tersedia untuk repo publik. Selama repo masih
# privat, workflow ini tetap hijau tetapi melewati deploy dan menulis catatan
# di ringkasan run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages unavailable, skip deploy
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::notice title=Deploy dilewati::GitHub Pages belum aktif untuk repo ini. Repo privat butuh GitHub Pro, Team, atau Enterprise; di GitHub Free, Pages hanya untuk repo publik. Ubah visibilitas jadi publik (Settings > General > Danger zone > Change visibility), lalu push lagi."

      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
