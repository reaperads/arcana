name: Deploy preview to GitHub Pages

# Hanya manual: GitHub Pages belum tersedia untuk repo privat ini, jadi menjalankan
# workflow pada setiap push hanya menghasilkan run yang gagal. Jalankan dari tab
# Actions setelah Pages tersedia (repo publik, atau repo privat dengan paket
# GitHub Pro/Team/Enterprise).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Explain why Pages is unavailable
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages tidak bisa dipakai untuk repo ini. Repo privat butuh GitHub Pro, Team, atau Enterprise; di GitHub Free, Pages hanya untuk repo publik."
          exit 1

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
